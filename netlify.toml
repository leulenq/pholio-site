[build]
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_APP_URL = "https://app.pholio.studio"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Static demos are served by Netlify before Next's headers can run.
# Apply the same noindex policy at the edge, including directory redirects.
[[headers]]
  for = "/zofia"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/zofia/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/talent-experience"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/talent-experience/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
