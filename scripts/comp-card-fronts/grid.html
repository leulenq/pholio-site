<meta charset="utf-8" />
<title>The Grid</title>
<style>
  {{FONT_FACES}}
  :root { --paper: #ffffff; --ink: #111111; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{PAGE_W}}px; height: {{PAGE_H}}px; background: var(--paper); }
  .card { position: relative; width: {{PAGE_W}}px; height: {{PAGE_H}}px; background: var(--paper); overflow: hidden; }
  .cell { position: absolute; overflow: hidden; }
  .cell img { position: absolute; display: block; }

  /* The rail. Two columns and nothing else: the name reads up the left
     edge, the city and height sit at its head, the photograph is the
     other column and runs off the top, right and foot of the page. */
  .name {
    position: absolute;
    left: {{RAIL_AXIS}}px;
    bottom: {{M}}px;
    transform: translateX(-50%) rotate(180deg);
    writing-mode: vertical-rl;
    font-family: "CardDisplay", system-ui, sans-serif;
    font-weight: 700;
    font-size: {{NAME_SIZE}}px;
    line-height: 1;
    letter-spacing: 0.005em;
    color: var(--ink);
    white-space: nowrap;
  }
  .info {
    position: absolute;
    left: {{M}}px;
    top: {{M}}px;
    font-family: "CardBody", system-ui, sans-serif;
    font-weight: 500;
    font-size: {{INFO_SIZE}}px;
    line-height: 2.1;
    letter-spacing: 0.2em;
    color: var(--ink);
  }
</style>
<div class="card">
  {{PHOTO}}
  <div class="name">{{NAME}}</div>
  <div class="info">{{INFO}}</div>
</div>
