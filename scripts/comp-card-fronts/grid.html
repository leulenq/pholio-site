<meta charset="utf-8" />
<title>The Grid</title>
<style>
  {{FONT_FACES}}
  :root { --paper: #ffffff; --ink: #111111; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{PAGE_W}}px; height: {{PAGE_H}}px; background: var(--paper); }
  .card { position: relative; width: {{PAGE_W}}px; height: {{PAGE_H}}px; background: var(--paper); overflow: hidden; }
  .cell { position: absolute; overflow: hidden; }
  .cell img { position: absolute; display: block; }

  /* The rail is one line of type, read upward, on one baseline: the name
     from the foot margin, the representation to the head margin. Both are
     placed by ink, not by line box (see the script below). */
  svg.rail { position: absolute; inset: 0; width: {{PAGE_W}}px; height: {{PAGE_H}}px; overflow: visible; }
  .name { font-family: "CardDisplay", system-ui, sans-serif; font-weight: 700; fill: var(--ink); letter-spacing: {{NAME_TRACKING}}em; }
  .rep { font-family: "CardBody", system-ui, sans-serif; font-weight: 500; font-size: {{REP_SIZE}}px; fill: var(--ink); }
  .rep .caps { letter-spacing: 0.18em; }
  .rep .addr { letter-spacing: 0.05em; }
</style>
<div class="card">
  {{PHOTO}}
  <svg class="rail" xmlns="http://www.w3.org/2000/svg">
    <text id="name" class="name">{{NAME}}</text>
    <text id="rep" class="rep">{{REP}}</text>
  </svg>
</div>
<script>
  // Layout of the rail, from measured ink. Constants come from render.cjs.
  const PAGE_H = {{PAGE_H}};
  const M = {{M}};              // page margin; the ink of the rail starts and ends on it
  const BASELINE_X = {{BASELINE_X}}; // shared baseline, cap height in from the margin
  const NAME_MAX = {{NAME_MAX}};
  const GAP_MIN = {{GAP_MIN}};  // least clear rail between the name and the representation
  const STACK_BELOW = {{STACK_BELOW}}; // a name that would scale below this is stacked instead
  const STACK_SIZE = {{STACK_SIZE}};   // size of each stacked line; two caps fill the rail slot
  const CAP = {{CAP}};

  window.__railReady = (async () => {
    await document.fonts.ready;
    const name = document.getElementById("name");
    const rep = document.getElementById("rep");

    // Representation line: ink ends on the head margin.
    let repLength = 0;
    if (rep.textContent.trim()) {
      const box = rep.getBBox();
      repLength = box.width;
      // Trailing letter-spacing is not ink; pull it back off the margin.
      const trailing = parseFloat(getComputedStyle(rep.lastElementChild || rep).letterSpacing) || 0;
      rep.setAttribute("transform", `translate(${BASELINE_X} ${M + repLength - trailing}) rotate(-90)`);
    } else {
      rep.remove();
    }

    // Name: fill the rail from the foot margin at the display size. A long
    // name scales down on the same baseline; below STACK_BELOW it is set as
    // two lines inside the same rail width instead (a balanced word break,
    // outer line at the margin, inner line on the shared baseline), so the
    // rail never widens and the name never drops below a legible size.
    const available = PAGE_H - 2 * M - repLength - (repLength ? GAP_MIN : 0);
    const ctx = document.createElement("canvas").getContext("2d");
    const place = (el, baselineX, size) => {
      el.setAttribute("font-size", size);
      // Left side bearing of the first glyph, so the ink (not the advance
      // box) starts on the margin. SVG's char extents are advance cells;
      // the canvas measures the ink itself.
      ctx.font = `700 ${size}px CardDisplay`;
      const lsb = -ctx.measureText(el.textContent[0]).actualBoundingBoxLeft;
      el.setAttribute("transform", `translate(${baselineX} ${PAGE_H - M + lsb}) rotate(-90)`);
      return lsb;
    };
    name.setAttribute("font-size", NAME_MAX);
    const widthAtMax = name.getBBox().width;
    let size = widthAtMax > available ? (available / widthAtMax) * NAME_MAX : NAME_MAX;
    let stacked = false;
    if (size < STACK_BELOW) {
      const words = name.textContent.trim().split(/\s+/);
      if (words.length > 1) {
        stacked = true;
        // Balanced break: the split whose longer line is shortest.
        let best = null;
        for (let i = 1; i < words.length; i++) {
          const a = words.slice(0, i).join(" "), b = words.slice(i).join(" ");
          name.textContent = a; const wa = name.getBBox().width;
          name.textContent = b; const wb = name.getBBox().width;
          const longest = Math.max(wa, wb);
          if (!best || longest < best.longest) best = { a, b, longest };
        }
        const inner = name.cloneNode(false);
        inner.id = "name-inner";
        name.textContent = best.a;
        inner.textContent = best.b;
        name.parentNode.appendChild(inner);
        size = Math.min(STACK_SIZE, (available / best.longest) * NAME_MAX);
        const cap = CAP * size;
        // Outer line: cap top on the margin. Inner line: on the baseline.
        place(name, M + cap, size);
        place(inner, BASELINE_X, size);
      }
    }
    if (!stacked) place(name, BASELINE_X, size);
    window.__rail = { size, stacked, repLength, widthAtMax, available };
  })();
</script>
