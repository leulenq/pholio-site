<meta charset="utf-8" />
<title>The Diptych</title>
<style>
  {{FONT_FACES}}
  :root { --ink: #0f172a; --ink-muted: rgba(15, 23, 42, 0.6); --paper: #faf7f2; --gold-dark: #a8894e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{PAGE_W}}px; height: {{PAGE_H}}px; background: var(--paper); }
  .card { position: relative; width: {{PAGE_W}}px; height: {{PAGE_H}}px; background: var(--paper); overflow: hidden; }
  .cell { position: absolute; overflow: hidden; background: var(--paper); }
  .cell img { position: absolute; display: block; }

  /* The hinge: one rule between the two panels, photograph on both sides. */
  .hinge {
    position: absolute;
    left: {{HINGE_X}}px;
    top: {{M}}px;
    height: {{PANEL_H}}px;
    width: 1px;
    background: rgba(15, 23, 42, 0.28);
  }
  .band {
    position: absolute;
    left: {{M}}px; right: {{M}}px;
    top: calc({{M}}px + {{PANEL_H}}px);
    bottom: {{M}}px;
    text-align: center;
  }
  .name {
    margin-top: 30px;
    font-family: "CardDisplay", Georgia, serif;
    font-weight: 500;
    font-size: {{NAME_SIZE}}px;
    line-height: 1;
    letter-spacing: 0.13em;
    margin-right: -0.13em;
    color: var(--ink);
  }
  .city {
    margin-top: 12px;
    font-family: "CardBody", system-ui, sans-serif;
    font-weight: 500;
    font-size: {{CITY_SIZE}}px;
    line-height: 1;
    letter-spacing: 0.28em;
    margin-right: -0.28em;
    color: var(--ink-muted);
  }
  .wordmark {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    font-family: "CardWordmark", Georgia, serif;
    font-weight: 400;
    font-size: {{MARK_SIZE}}px;
    line-height: 1;
    letter-spacing: 0.2em;
    margin-right: -0.2em;
    color: var(--gold-dark);
  }
</style>
<div class="card">
  {{LEFT}}
  {{RIGHT}}
  <div class="hinge"></div>
  <div class="band">
    <div class="name">{{NAME}}</div>
    <div class="city">{{CITY}}</div>
    <div class="wordmark">PHOLIO</div>
  </div>
</div>
